[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-keeper"
version = "0.1.1"
description = "Minimalist external memory for developers - CLI bridge between brain, AI, and Git."
requires-python = ">=3.8"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools]
packages = ["cklib"]

[project.scripts]
ck = "cklib.cli:main"
ck-clean = "cklib.cli:clean_sandbox_entrypoint"