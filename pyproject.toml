[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-keeper"
version = "0.1.0"
description = "Minimalist external memory for developers - CLI bridge between brain, AI, and Git."
requires-python = ">=3.8"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools]
packages = ["cklib"]